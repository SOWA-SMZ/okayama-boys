<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岡山ボーイズ 1年生 測定結果</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:   #0a1628;
    --blue:   #1a3a6b;
    --gold:   #c8962a;
    --gold-l: #e8b84b;
    --white:  #f5f7fa;
    --row1:   #0d1f3c;
    --row2:   #0f2347;
    --gray:   #8a9ab5;
    --hover:  #163060;
    --fixed-w1: 52px;   /* 背番号列幅 */
    --fixed-w2: 120px;  /* 選手名列幅 */
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding: 28px 16px 56px;
  }

  .header { text-align: center; margin-bottom: 28px; }
  .header-line {
    width: 80px; height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 18px;
  }
  .team {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(28px, 6vw, 48px);
    letter-spacing: .15em;
    color: var(--gold-l);
    line-height: 1;
  }
  .subtitle {
    font-size: clamp(13px, 2.5vw, 16px);
    color: var(--gray);
    margin-top: 8px;
    letter-spacing: .1em;
  }
  .divider {
    width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
    margin-top: 20px;
    opacity: .5;
  }

  /* テーブル外枠 */
  .wrap {
    overflow-x: auto;
    border-radius: 10px;
    border: 1px solid rgba(200,150,42,.2);
    box-shadow: 0 12px 48px rgba(0,0,0,.6);
    margin-top: 4px;
    -webkit-overflow-scrolling: touch;
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    min-width: 680px;
  }

  /* ===== 固定列共通 ===== */
  .sticky-1,
  .sticky-2 {
    position: sticky;
    z-index: 2;
  }
  .sticky-1 {
    left: 0;
    width: var(--fixed-w1);
    min-width: var(--fixed-w1);
    max-width: var(--fixed-w1);
  }
  .sticky-2 {
    left: var(--fixed-w1);
    width: var(--fixed-w2);
    min-width: var(--fixed-w2);
    max-width: var(--fixed-w2);
  }

  /* ===== ヘッダー ===== */
  thead th {
    background: var(--blue);
    color: var(--gold-l);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 13px 10px;
    text-align: center;
    border-bottom: 2px solid var(--gold);
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  thead th.sticky-1,
  thead th.sticky-2 {
    z-index: 3; /* ヘッダー固定列は最前面 */
    background: var(--blue);
  }
  thead th.sticky-2 {
    text-align: left;
    padding-left: 12px;
    /* 固定列の右端に影 */
    box-shadow: 3px 0 8px rgba(0,0,0,.4);
  }

  /* ===== データ行 ===== */
  tbody tr {
    border-bottom: 1px solid rgba(255,255,255,.04);
    transition: background .15s;
    opacity: 0;
    animation: fadeUp .4s ease forwards;
  }
  tbody tr:nth-child(odd)  { background: var(--row1); }
  tbody tr:nth-child(even) { background: var(--row2); }
  tbody tr:hover { background: var(--hover); }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }
  tbody tr:nth-child(1)  { animation-delay:.04s }
  tbody tr:nth-child(2)  { animation-delay:.08s }
  tbody tr:nth-child(3)  { animation-delay:.12s }
  tbody tr:nth-child(4)  { animation-delay:.16s }
  tbody tr:nth-child(5)  { animation-delay:.20s }
  tbody tr:nth-child(6)  { animation-delay:.24s }
  tbody tr:nth-child(7)  { animation-delay:.28s }
  tbody tr:nth-child(8)  { animation-delay:.32s }
  tbody tr:nth-child(9)  { animation-delay:.36s }
  tbody tr:nth-child(10) { animation-delay:.40s }
  tbody tr:nth-child(11) { animation-delay:.44s }
  tbody tr:nth-child(12) { animation-delay:.48s }
  tbody tr:nth-child(13) { animation-delay:.52s }
  tbody tr:nth-child(14) { animation-delay:.56s }
  tbody tr:nth-child(15) { animation-delay:.60s }

  td {
    padding: 11px 10px;
    font-size: 13px;
    text-align: center;
    color: var(--white);
    border-bottom: 1px solid rgba(255,255,255,.04);
  }

  /* 固定列のセル背景（行の背景色を継承） */
  tbody tr:nth-child(odd)  td.sticky-1,
  tbody tr:nth-child(odd)  td.sticky-2 { background: var(--row1); }
  tbody tr:nth-child(even) td.sticky-1,
  tbody tr:nth-child(even) td.sticky-2 { background: var(--row2); }
  tbody tr:hover td.sticky-1,
  tbody tr:hover td.sticky-2 { background: var(--hover); }

  /* 選手名固定列の右端に影 */
  td.sticky-2 {
    box-shadow: 3px 0 8px rgba(0,0,0,.4);
    text-align: left;
    padding-left: 12px;
    font-weight: 700;
    font-size: 14px;
    white-space: nowrap;
  }

  /* 背番号バッジ */
  .num-badge {
    display: inline-block;
    background: var(--blue);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 2px 7px;
    font-size: 13px;
    font-weight: 900;
    color: var(--gold-l);
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: .05em;
  }

  /* 遠投バッジ */
  .throws { display:flex; gap:4px; justify-content:center; flex-wrap:wrap; }
  .tv {
    background: rgba(26,58,107,.9);
    border: 1px solid rgba(200,150,42,.25);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 700;
    color: #c8d8ff;
  }

  /* ベスト値ハイライト */
  .best { color: var(--gold-l) !important; font-weight: 900 !important; }
  .best::after {
    content: '★';
    font-size: 9px;
    vertical-align: super;
    margin-left: 2px;
    opacity: .8;
  }

  /* フッター集計行 */
  tfoot tr { border-top: 2px solid var(--gold); }
  tfoot td {
    color: var(--gold-l);
    font-weight: 900;
    font-size: 13px;
    padding: 12px 10px;
    background: var(--blue);
  }
  tfoot td.sticky-1,
  tfoot td.sticky-2 { background: var(--blue); }
  tfoot td.sticky-2 { box-shadow: 3px 0 8px rgba(0,0,0,.4); }
  tfoot td.foot-label { text-align: center; font-size: 11px; letter-spacing: .05em; }

  .legend {
    text-align: center;
    margin-top: 16px;
    font-size: 11px;
    color: var(--gray);
  }
  footer {
    text-align: center;
    margin-top: 32px;
    font-size: 11px;
    color: rgba(138,154,181,.4);
    letter-spacing: .06em;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-line"></div>
  <div class="team">OKAYAMA BOYS</div>
  <div class="subtitle">岡山ボーイズ &nbsp;|&nbsp; 1年生 フィジカル測定結果 &nbsp;|&nbsp; 2026年5月23日</div>
  <div class="divider"></div>
</div>

<div class="wrap">
<table>
  <thead>
    <tr>
      <th class="sticky-1">背番号</th>
      <th class="sticky-2">選手名</th>
      <th>遠投 ①②③（m）</th>
      <th>最長（m）</th>
      <th>50m走（秒）</th>
      <th>塁間（秒）</th>
      <th>ベースランニング（秒）</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
  <tfoot>
    <tr>
      <td class="sticky-1 foot-label"></td>
      <td class="sticky-2 foot-label">ベスト値</td>
      <td></td>
      <td id="b-throw"></td>
      <td id="b-50"></td>
      <td id="b-rui"></td>
      <td id="b-base"></td>
    </tr>
  </tfoot>
</table>
</div>

<div class="legend">★ = 各項目ベスト値　／　左2列は固定（横スクロール対応）</div>
<footer>岡山ボーイズ 指導者用資料</footer>

<script>
const players = [
  { num:51, name:"村川 昭徳",  t:[59,50,58], r50:7.98, rui:4.87, base:18.21 },
  { num: 5, name:"緒方 相",    t:[58,49,51], r50:7.91, rui:4.82, base:17.5  },
  { num: 2, name:"太田 泰嗣",  t:[52,51,52], r50:8.45, rui:5.15, base:18.55 },
  { num:37, name:"豊田 凰輝",  t:[45,42,52], r50:8.02, rui:4.94, base:17.65 },
  { num:56, name:"桐山 竜成",  t:[45,48,47], r50:8.29, rui:5.05, base:18.52 },
  { num: 9, name:"大久保 玲",  t:[41,40,50], r50:8.49, rui:5.06, base:18.76 },
  { num:27, name:"長尾 勇飛",  t:[63,62,61], r50:8.12, rui:5.20, base:18.81 },
  { num:99, name:"髙須 春平",  t:[55,58,57], r50:7.84, rui:5.09, base:18.47 },
  { num:55, name:"弦田 眞沙仁",t:[49,50,52], r50:9.00, rui:5.14, base:20.63 },
  { num:23, name:"吉行 蓮",    t:[60,61,59], r50:7.60, rui:4.43, base:17.18 },
  { num:92, name:"植田 晴翔",  t:[55,55,52], r50:8.52, rui:5.21, base:18.98 },
  { num: 8, name:"佐藤 瑛真",  t:[52,53,48], r50:9.02, rui:5.19, base:19.66 },
  { num:11, name:"月川 篤貴",  t:[58,61,59], r50:8.59, rui:4.91, base:18.64 },
  { num:16, name:"光石 桃悟",  t:[53,55,57], r50:8.57, rui:5.35, base:19.53 },
  { num:15, name:"岡村 太郎",  t:[54,49,54], r50:8.87, rui:5.61, base:19.54 },
];

const bestThrow = Math.max(...players.map(p => Math.max(...p.t)));
const best50    = Math.min(...players.map(p => p.r50));
const bestRui   = Math.min(...players.map(p => p.rui));
const bestBase  = Math.min(...players.map(p => p.base));

const tbody = document.getElementById('tbody');
players.forEach(p => {
  const maxT = Math.max(...p.t);
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="sticky-1"><span class="num-badge">${p.num}</span></td>
    <td class="sticky-2">${p.name}</td>
    <td><div class="throws">${p.t.map(v=>`<span class="tv">${v}</span>`).join('')}</div></td>
    <td class="${maxT===bestThrow?'best':''}">${maxT}</td>
    <td class="${p.r50===best50?'best':''}">${p.r50.toFixed(2)}</td>
    <td class="${p.rui===bestRui?'best':''}">${p.rui.toFixed(2)}</td>
    <td class="${p.base===bestBase?'best':''}">${p.base.toFixed(2)}</td>
  `;
  tbody.appendChild(tr);
});

document.getElementById('b-throw').textContent = bestThrow;
document.getElementById('b-50').textContent    = best50.toFixed(2);
document.getElementById('b-rui').textContent   = bestRui.toFixed(2);
document.getElementById('b-base').textContent  = bestBase.toFixed(2);
</script>
</body>
</html>
