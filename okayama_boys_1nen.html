<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岡山ボーイズ 1年生 測定結果</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:   #0a1628;
    --blue:   #1a3a6b;
    --gold:   #c8962a;
    --gold-l: #e8b84b;
    --white:  #f5f7fa;
    --row1:   #0d1f3c;
    --row2:   #0f2347;
    --gray:   #8a9ab5;
    --hover:  #163060;
    --w1: 56px;
    --w2: 118px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding: 20px 10px 56px;
  }

  /* ヘッダー */
  .header { text-align: center; margin-bottom: 22px; }
  .header-line {
    width: 60px; height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 14px;
  }
  .team {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(26px, 7vw, 48px);
    letter-spacing: .15em;
    color: var(--gold-l);
    line-height: 1;
  }
  .subtitle {
    font-size: clamp(11px, 2.8vw, 15px);
    color: var(--gray);
    margin-top: 6px;
    letter-spacing: .06em;
  }
  .divider {
    width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
    margin-top: 16px;
    opacity: .4;
  }

  /* ソートボタン群 */
  .sort-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 14px 0 10px;
  }
  .sort-btn {
    background: var(--blue);
    border: 1px solid rgba(200,150,42,.3);
    color: var(--gray);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 20px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .sort-btn:active { transform: scale(.95); }
  .sort-btn.active {
    background: var(--gold);
    color: var(--navy);
    font-weight: 700;
    border-color: var(--gold);
  }

  /* テーブル外枠 */
  .wrap {
    overflow-x: auto;
    overflow-y: auto;
    max-height: 72vh;
    border-radius: 10px;
    border: 1px solid rgba(200,150,42,.2);
    box-shadow: 0 8px 36px rgba(0,0,0,.6);
    -webkit-overflow-scrolling: touch;
  }

  /* スクロールヒント */
  .scroll-hint {
    text-align: center;
    font-size: 10px;
    color: var(--gray);
    margin-top: 6px;
    opacity: .7;
    display: none;
  }
  @media (max-width: 600px) { .scroll-hint { display: block; } }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    min-width: 620px;
  }

  /* 固定列 */
  .s1, .s2 { position: sticky; z-index: 2; }
  .s1 { left: 0; width: var(--w1); min-width: var(--w1); }
  .s2 { left: var(--w1); width: var(--w2); min-width: var(--w2); }

  /* ヘッダー */
  thead th {
    background: var(--blue);
    color: var(--gold-l);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .06em;
    padding: 11px 8px;
    text-align: center;
    border-bottom: 2px solid var(--gold);
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 1;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { background: #1f4a8a; }
  thead th.s1, thead th.s2 { z-index: 3; background: var(--blue); cursor: default; }
  thead th.s1:hover, thead th.s2:hover { background: var(--blue); }
  thead th.s2 {
    text-align: left;
    padding-left: 12px;
    box-shadow: 3px 0 8px rgba(0,0,0,.5);
  }
  /* ソートアイコン */
  thead th .sort-icon { margin-left: 3px; opacity: .4; font-size: 9px; }
  thead th.sorted-asc .sort-icon::after  { content: '▲'; opacity: 1; color: var(--gold-l); }
  thead th.sorted-desc .sort-icon::after { content: '▼'; opacity: 1; color: var(--gold-l); }
  thead th:not(.sorted-asc):not(.sorted-desc) .sort-icon::after { content: '⇅'; }

  /* データ行 */
  tbody tr {
    transition: background .12s;
  }
  tbody tr:nth-child(odd)  { background: var(--row1); }
  tbody tr:nth-child(even) { background: var(--row2); }
  tbody tr:active { background: var(--hover); }
  @media (hover: hover) {
    tbody tr:hover { background: var(--hover); }
  }

  td {
    padding: 10px 8px;
    font-size: 13px;
    text-align: center;
    color: var(--white);
    border-bottom: 1px solid rgba(255,255,255,.04);
  }

  /* 固定列の背景 */
  tbody tr:nth-child(odd)  td.s1,
  tbody tr:nth-child(odd)  td.s2 { background: var(--row1); }
  tbody tr:nth-child(even) td.s1,
  tbody tr:nth-child(even) td.s2 { background: var(--row2); }
  tbody tr:active td.s1,
  tbody tr:active td.s2 { background: var(--hover); }

  td.s2 {
    text-align: left;
    padding-left: 12px;
    font-weight: 700;
    font-size: 13px;
    white-space: nowrap;
    box-shadow: 3px 0 8px rgba(0,0,0,.5);
  }

  /* 背番号バッジ */
  .num-badge {
    display: inline-block;
    background: var(--blue);
    border: 1px solid var(--gold);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 13px;
    font-weight: 900;
    color: var(--gold-l);
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: .05em;
    min-width: 32px;
    text-align: center;
  }

  /* 遠投バッジ */
  .throws { display:flex; gap:3px; justify-content:center; flex-wrap:wrap; }
  .tv {
    background: rgba(26,58,107,.9);
    border: 1px solid rgba(200,150,42,.2);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    font-weight: 700;
    color: #c8d8ff;
  }

  /* ベスト値ハイライト */
  .best { color: var(--gold-l) !important; font-weight: 900 !important; }
  .best::after {
    content: '★';
    font-size: 8px;
    vertical-align: super;
    margin-left: 1px;
    opacity: .9;
  }

  /* ベスト値行 */
  tfoot tr.row-best { border-top: 2px solid var(--gold); }
  tfoot tr.row-best td {
    background: var(--blue);
    color: var(--gold-l);
    font-weight: 900;
    font-size: 12px;
    padding: 10px 8px;
  }
  tfoot tr.row-best td.s1,
  tfoot tr.row-best td.s2 {
    background: var(--blue);
    box-shadow: 3px 0 8px rgba(0,0,0,.5);
  }

  /* 平均値行 */
  tfoot tr.row-avg td {
    background: #0b1e3a;
    color: #90b8ff;
    font-weight: 700;
    font-size: 12px;
    padding: 10px 8px;
    border-top: 1px solid rgba(200,150,42,.2);
  }
  tfoot tr.row-avg td.s1,
  tfoot tr.row-avg td.s2 {
    background: #0b1e3a;
    box-shadow: 3px 0 8px rgba(0,0,0,.5);
  }
  tfoot td.label { text-align: center; font-size: 10px; letter-spacing: .04em; }

  .legend {
    text-align: center;
    margin-top: 12px;
    font-size: 10px;
    color: var(--gray);
    line-height: 1.8;
  }
  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 10px;
    color: rgba(138,154,181,.35);
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-line"></div>
  <div class="team">OKAYAMA BOYS</div>
  <div class="subtitle">岡山ボーイズ &nbsp;|&nbsp; 1年生 フィジカル測定結果 &nbsp;|&nbsp; 2026年5月23日</div>
  <div class="divider"></div>
</div>

<div class="sort-bar">
  <button class="sort-btn active" onclick="sortBy('num')">背番号順</button>
  <button class="sort-btn" onclick="sortBy('throw')">遠投</button>
  <button class="sort-btn" onclick="sortBy('r50')">50m走</button>
  <button class="sort-btn" onclick="sortBy('rui')">塁間</button>
  <button class="sort-btn" onclick="sortBy('base')">ベースランニング</button>
</div>

<div class="wrap">
<table>
  <thead>
    <tr>
      <th class="s1">#</th>
      <th class="s2">選手名</th>
      <th>遠投 ①②③（m）</th>
      <th data-col="throw">最長（m）<span class="sort-icon"></span></th>
      <th data-col="r50">50m走（秒）<span class="sort-icon"></span></th>
      <th data-col="rui">塁間（秒）<span class="sort-icon"></span></th>
      <th data-col="base">ベースランニング（秒）<span class="sort-icon"></span></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
  <tfoot>
    <tr class="row-best">
      <td class="s1 label"></td>
      <td class="s2 label">ベスト値</td>
      <td></td>
      <td id="b-throw"></td>
      <td id="b-50"></td>
      <td id="b-rui"></td>
      <td id="b-base"></td>
    </tr>
    <tr class="row-avg">
      <td class="s1 label"></td>
      <td class="s2 label">平均値</td>
      <td></td>
      <td id="a-throw"></td>
      <td id="a-50"></td>
      <td id="a-rui"></td>
      <td id="a-base"></td>
    </tr>
  </tfoot>
</table>
</div>

<div class="scroll-hint">← 横にスクロールできます →</div>

<div class="legend">
  ★ = 各項目ベスト値　／　左2列固定・横スクロール対応<br>
  項目名タップまたはボタンで並び替え可能
</div>
<footer>岡山ボーイズ 指導者用資料</footer>

<script>
let players = [
  { num: 2, name:"太田 泰嗣",   t:[52,51,52], r50:8.45, rui:5.15, base:18.55 },
  { num: 5, name:"緒方 相",     t:[58,49,51], r50:7.91, rui:4.82, base:17.50 },
  { num: 8, name:"佐藤 瑛真",   t:[52,53,48], r50:9.02, rui:5.19, base:19.66 },
  { num: 9, name:"大久保 玲",   t:[41,40,50], r50:8.49, rui:5.06, base:18.76 },
  { num:11, name:"月川 篤貴",   t:[58,61,59], r50:8.59, rui:4.91, base:18.64 },
  { num:15, name:"岡村 太郎",   t:[54,49,54], r50:8.87, rui:5.61, base:19.54 },
  { num:16, name:"光石 桃悟",   t:[53,55,57], r50:8.57, rui:5.35, base:19.53 },
  { num:23, name:"吉行 蓮",     t:[60,61,59], r50:7.60, rui:4.43, base:17.18 },
  { num:27, name:"長尾 勇飛",   t:[63,62,61], r50:8.12, rui:5.20, base:18.81 },
  { num:37, name:"豊田 凰輝",   t:[45,42,52], r50:8.02, rui:4.94, base:17.65 },
  { num:51, name:"村川 昭徳",   t:[59,50,58], r50:7.98, rui:4.87, base:18.21 },
  { num:55, name:"弦田 眞沙仁", t:[49,50,52], r50:9.00, rui:5.14, base:20.63 },
  { num:56, name:"桐山 竜成",   t:[45,48,47], r50:8.29, rui:5.05, base:18.52 },
  { num:92, name:"植田 晴翔",   t:[55,55,52], r50:8.52, rui:5.21, base:18.98 },
  { num:99, name:"髙須 春平",   t:[55,58,57], r50:7.84, rui:5.09, base:18.47 },
];

const bestThrow = Math.max(...players.map(p => Math.max(...p.t)));
const best50    = Math.min(...players.map(p => p.r50));
const bestRui   = Math.min(...players.map(p => p.rui));
const bestBase  = Math.min(...players.map(p => p.base));

// ベスト値・平均値
document.getElementById('b-throw').textContent = bestThrow;
document.getElementById('b-50').textContent    = best50.toFixed(2);
document.getElementById('b-rui').textContent   = bestRui.toFixed(2);
document.getElementById('b-base').textContent  = bestBase.toFixed(2);

const avg = arr => arr.reduce((a,b) => a+b, 0) / arr.length;
document.getElementById('a-throw').textContent = avg(players.map(p => Math.max(...p.t))).toFixed(1);
document.getElementById('a-50').textContent    = avg(players.map(p => p.r50)).toFixed(2);
document.getElementById('a-rui').textContent   = avg(players.map(p => p.rui)).toFixed(2);
document.getElementById('a-base').textContent  = avg(players.map(p => p.base)).toFixed(2);

// 描画
function render(data) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  data.forEach(p => {
    const maxT = Math.max(...p.t);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="s1"><span class="num-badge">${p.num}</span></td>
      <td class="s2">${p.name}</td>
      <td><div class="throws">${p.t.map(v => `<span class="tv">${v}</span>`).join('')}</div></td>
      <td class="${maxT === bestThrow  ? 'best' : ''}">${maxT}</td>
      <td class="${p.r50 === best50   ? 'best' : ''}">${p.r50.toFixed(2)}</td>
      <td class="${p.rui === bestRui  ? 'best' : ''}">${p.rui.toFixed(2)}</td>
      <td class="${p.base === bestBase ? 'best' : ''}">${p.base.toFixed(2)}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ソート
let currentSort = 'num';
let sortAsc = true;

function sortBy(key) {
  if (currentSort === key) {
    sortAsc = !sortAsc;
  } else {
    currentSort = key;
    // 遠投・塁間・ベースランは降順→昇順の優先が直感的
    sortAsc = (key === 'num');
  }

  // ボタンのactive切り替え
  document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
  const btnMap = { num:0, throw:1, r50:2, rui:3, base:4 };
  document.querySelectorAll('.sort-btn')[btnMap[key]].classList.add('active');

  // ヘッダーのソートアイコン
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.classList.remove('sorted-asc','sorted-desc');
    if (th.dataset.col === key) {
      th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
    }
  });

  const getVal = p => {
    if (key === 'num')   return p.num;
    if (key === 'throw') return Math.max(...p.t);
    if (key === 'r50')   return p.r50;
    if (key === 'rui')   return p.rui;
    if (key === 'base')  return p.base;
  };

  const sorted = [...players].sort((a,b) => {
    const va = getVal(a), vb = getVal(b);
    return sortAsc ? va - vb : vb - va;
  });

  render(sorted);
}

// 初期表示（背番号順）
render(players);
</script>
</body>
</html>
